name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Verify launcher
        run: node bin/agents-setup.js --help

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Read package metadata
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check npm version
        id: npm
        run: |
          npm view "${{ steps.package.outputs.name }}" versions --json > "$RUNNER_TEMP/npm-versions.json"
          if node -e 'const published = require(process.argv[1]); const versions = Array.isArray(published) ? published : [published]; process.exit(versions.includes(process.argv[2]) ? 0 : 1)' \
            "$RUNNER_TEMP/npm-versions.json" "${{ steps.package.outputs.version }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.exists == 'false'
        run: npm publish --access public

      - name: Skip existing version
        if: steps.npm.outputs.exists == 'true'
        run: echo "Package version already exists on npm; skipping publish."
